# Rime schema
# encoding: utf-8

schema:
  schema_id: neoluna_pinyin
  name: 朙月拼音Neo
  version: '0.1'
  author:
    - 海秋 <admin@hoicau.com>
  description: |
    朙月拼音Neo

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: zh_hant
    states: [ 简体, 繁體 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - table_translator@custom_phrase     # 自定义短语 custom_phrase.txt
    - lua_translator@*force_gc           # 暴力 GC
  filters:
    # - lua_filter@*corrector              # 错音错字提示
    - lua_filter@*pin_cand_filter        # 置顶候选项（顺序要求：置顶候选项 > 简繁切换）
    # - lua_filter@*long_word_filter       # 长词优先
    - simplifier@zh_hant
    - uniquifier

long_word_filter:
  count: 2
  idx: 4

